# Local Tiger Data–compatible Postgres for development and tests.
# timescaledb-ha ships TimescaleDB, pgvector and pgvectorscale, matching Tiger Cloud.
services:
  db:
    image: timescale/timescaledb-ha:pg18
    environment:
      POSTGRES_PASSWORD: atlas
      POSTGRES_USER: atlas
      POSTGRES_DB: atlas
    ports:
      - "54329:5432"
    volumes:
      - atlas-db:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  atlas-db:
